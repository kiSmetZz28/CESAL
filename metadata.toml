backbones classify abnormal log sequences into 10 known anomaly types or "Other anomaly
type". Qwen2.5-14B-Instruct, the default backbone, reaches macro-average F1 83.03.
"""
script2 = "https://github.com/kiSmetZz28/CESAL/blob/main/artifact/claims/claim2_classification.sh"
expected2 = """
Writes per-model and per-class metrics under outputs/hdfs/llm/ and prints the macro average
