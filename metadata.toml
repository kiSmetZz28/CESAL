# ── Claims ────────────────────────────────────────────────────────────────────
claim1 = """
Log-based incident detection (paper Section 4.2, Table 3): Q-BAT edge-only reaches F1 99.53
on HDFS and 99.03 on OpenStack; CESAL, routing 10% of samples to the cloud, reaches F1 99.98
on HDFS and 99.95 on OpenStack.
"""
script1 = "https://github.com/kiSmetZz28/CESAL/blob/main/artifact/claims/claim1_detection.sh"
expected1 = """
Prints Accuracy/Precision/Recall/F-score for the edge stage and for the collaborative
(hybrid) stage on the chosen dataset, and compares them with the Table 3 values.
Expected within about +/-0.5 F1: HDFS edge 99.53, HDFS CESAL 99.98, OpenStack edge 99.03,
OpenStack CESAL 99.95.

IMPORTANT — evaluation protocol: these are point-adjusted scores. Following the Anomaly
Transformer convention this code inherits, training_pipeline/solver.py applies point
adjustment (lines 394-412) before computing metrics: once any line inside a ground-truth
anomaly segment is detected, the whole segment counts as detected. Both test sets are
assembled as all-normal lines followed by all-abnormal lines
(cesal_core/data/loaders.py:45-53), so each contains exactly one anomaly segment. The
script therefore also prints raw, un-adjusted scores so both numbers are visible.
"""

claim2 = """
