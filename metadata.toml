infrastructure_constraints = "Evaluation needs a Linux x86-64 machine with an NVIDIA GPU. The experiments were developed and measured on local workstations (i7-14700, NVIDIA RTX 2000 Ada 16 GB, 32 GB RAM, Ubuntu 24.04.2), not on public infrastructure. The paper's edge resource measurements (Table 6) were taken on physical Raspberry Pi 3B+/4B/5 boards and are not offered for evaluation."
infrastructure_access = ""

install_script = "https://github.com/kiSmetZz28/CESAL/blob/main/install.sh"

use = "Research artifact for reproducing the paper's detection results (Table 3), open-set incident classification (Table 7) and response-workflow mapping (Table 1) on the public HDFS and OpenStack log benchmarks. It is not a production intrusion-detection or incident-response system: the response module selects and prints workflows but never executes them. Detection is evaluated on OpenStack because the HDFS edge scan takes about 15 days of CPU time. Edge latency, memory and power figures need Raspberry Pi hardware and cannot be reproduced on a workstation."

destructive = "None. The artifact reads the bundled data and writes inside the repository (checkpoints/, outputs/, logs/, and the ExecuTorch runtime under cesal_inference_pipeline/), installs Python packages into the active Conda environment, and caches LLM weights in ~/.cache/huggingface. Response workflows are selected and printed, never executed against any system. Outside the evaluation path, `run.py convert` writes to checkpoints/qbat/ and replaces downloaded Q-BAT models of the same name."

claim1 = "On OpenStack, Q-BAT alone detects anomalies at the edge (Table 3, Edge row), and routing the most uncertain 10% of windows to the cloud BAT ensemble recovers cloud-level accuracy (Table 3, CESAL row)."
script1 = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#the-short-path-about-three-hours"
expected1 = "`python run.py download os` then `python run.py infer os` (in cesal-edge, about 3 h 20 m) prints Table 3's OpenStack rows at the end of the run: Q-BAT edge only P 98.09 / R 100.00 / F1 99.03, and CESAL with 10% routed to the cloud P 99.90 / R 100.00 / F1 99.95. Scores are deterministic with the published checkpoints; treat agreement within 0.1 F1 as reproduced."

claim2 = "The full-precision BAT ensemble alone is the accuracy ceiling on OpenStack (Table 3, BAT cloud-only row)."
script2 = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#evaluate-the-ensemble"
expected2 = "`python run.py eval os` (about 8 min on one GPU, after the download in claim 1) prints Table 3's BAT cloud-only row on OpenStack: P 99.99 / R 100.00 / F1 99.99, for majority voting across all 81 models. Treat agreement within 0.1 F1 as reproduced."

claim3 = "Retrieval-augmented LLM open-set classification labels detected HDFS incidents as one of 10 known anomaly types or unknown, with Qwen2.5-14B-Instruct as the best backbone (Table 7)."
script3 = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#step-4--incident-classification-and-controlled-response-hdfs"
expected3 = "`python run.py classify qwen2.5-14b-instruct` (in cesal-cloud, about 1 h 51 m on one GPU, ~28 GB of weights) writes outputs/hdfs/llm/model_summary.csv, whose Qwen/Qwen2.5-14B-Instruct row gives Table 7's best-backbone result: macro P 79.71 / R 92.07 / F1 83.03. LLM decoding is greedy, but backbone and kernel versions can move macro-F1 by a few tenths; treat agreement within 1 F1 as reproduced. Per-class reference values are in outputs/hdfs/llm/table7_reference_metrics.csv."

claim4 = "Each classified incident is mapped to its predefined response workflow, and unknown anomaly types map to human investigation with no automated mitigation (Table 1)."
script4 = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#step-4--incident-classification-and-controlled-response-hdfs"
expected4 = "After claim 3, `python -m incident_response.workflows --results outputs/hdfs/llm/results_Qwen_Qwen2.5-14B-Instruct.csv` (seconds, no GPU) prints one row per predicted label: every known label maps to the workflow of the same name, and \"Other anomaly type\" maps to \"Unknown Anomaly Types\". The workflow steps are defined verbatim from Table 1 in incident_response/workflows.py."

claim5 = "The core logic (EM-GMM thresholding, energy scoring and voting, Mahalanobis routing policy, response workflows) is correct in isolation."
script5 = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#the-short-path-about-three-hours"
expected5 = "`pytest tests` in cesal-edge reports 88 passed in a few seconds, with no checkpoints or GPU."

hw = """x86-64 Linux machine (the pre-built ExecuTorch executor_runner is an x86-64 binary).
NVIDIA GPU with CUDA 12.4 support for BAT cloud verification and LLM classification; tested on an RTX 2000 Ada (16 GB VRAM). A backbone larger than the available VRAM is partly offloaded to CPU RAM, which is slower.
32 GB RAM (tested).
Disk: about 12 GB for detection (claims 1-2) plus about 28 GB for the Qwen2.5-14B-Instruct weights (claim 3).
The edge resource measurements (Table 6) need physical Raspberry Pi 3B+/4B/5 boards and are not offered."""

sw = """Recommended: Docker with the NVIDIA Container Toolkit, using the image ghcr.io/kismetzz28/cesal:v1.0, which already contains both environments and the ExecuTorch runtime, so no environment setup is needed.
Alternatively: Linux (tested on Ubuntu 24.04.2), Conda and Python 3.10, with two Conda environments created from the repository's requirements files: cesal-edge (PyTorch 2.6 CPU + ExecuTorch 0.5.0) and cesal-cloud (PyTorch 2.4 + CUDA 12.4 + transformers 4.47).
Either way, an NVIDIA driver supporting CUDA 12.4. No paid or proprietary software."""

api = """No paid services or API keys.
Checkpoints and the ExecuTorch runtime download from Google Drive without credentials, and Qwen2.5-14B-Instruct downloads from Hugging Face without login.
Only the optional four-backbone Table 7 sweep needs a free Hugging Face token, for the gated Llama-3.1-8B-Instruct and Gemma-2-9B-IT."""

