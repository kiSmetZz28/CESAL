use = """
Research artifact containing source code, parsed HDFS/OpenStack splits, inference configurations, calibration thresholds, software checks and response workflows. Detectors are obtained in one of two ways, both writing to checkpoints/bat/<dataset> and checkpoints/qbat/<dataset> so that every later step is identical. Train them: python run.py train os builds the 81 BAT learners, python run.py eval os calibrates their thresholds, and python run.py convert os exports the quantized Q-BAT programs. Or download the published checkpoints the paper's numbers were measured on: python run.py download os, which also installs the ExecuTorch runtime with Q-BAT. Downloaded checkpoints ship with matching thresholds, so eval is only required after training. The Dockerfile and native installation script are included.

Dataset accounting: preprocessing reports source references, bundled sequence counts, per-event context rows, standardization and complete model windows. OpenStack source-message descriptions use the paper's counts: 207,820 total, 52,312 training, 137,074 normal test (derived from the split), and 18,434 abnormal test. Actual generated context rows and windows are reported separately from the current bundled inputs; these runtime counts are not replaced with paper references. HDFS training and abnormal log-sequence counts match Section 4.1 (4,855 and 16,838), but bundled total log sequences are 575,059 versus 575,061 in the original anomaly_label.csv (two fewer normal log sequences). HDFS bundled parsed events total 11,172,157 versus 11,175,629 source messages in the paper. README.md documents these stages and windowing losses. Inputs are used unchanged, and optional raw files are not scanned during normal inference.

One-time software check: in cesal-edge, run python run.py check. It reports VERIFIED by component and ends with Core software checks completed successfully. Failures and skipped checks are identified; diagnostics are saved under outputs/checks/. A successful install.sh already includes this check. Repeat after relevant code/environment changes or when troubleshooting, not before every normal run. Software checks alone do not establish that pretrained models or LLMs have executed.

Small real experiment: after downloading checkpoints, run python run.py smoke os once. It selects ten complete OpenStack windows (500 normal and 500 abnormal events) after full-dataset preprocessing, preserving event encoding and training-based scaling. It uses three published Q-BAT models, the existing 10% event-routing policy and three BAT models. The observed local CPU runtime was about 80 seconds; allow roughly 1-2 minutes on comparable hardware, excluding setup/downloads. Each run writes under outputs/smoke/os/run_*/, including experiment.json, copied inputs/thresholds, output arrays, pipeline.log and READY.txt after validation. The terminal shows execution progress and component readiness without detection metrics or anomaly-count summaries. Full pipeline output is retained in pipeline.log for troubleshooting; subset metrics there are not Table 3 results. Normal evaluation retains the full test set and all 81 BAT cloud models, with its usual score reporting.

Paper-result evaluation: claims 1-4 below cover OpenStack detection (Table 3), standalone HDFS classification (Table 7), and workflow selection (Table 1). Together these take roughly 5-6 hours after setup/downloads on the documented workstation. Classification scores use macro averaging.

Reproducible training: training is seeded end to end. Every learner takes a stable seed derived from the master seed (42 by default), the dataset and its hyperparameters; deterministic kernels are required and training_manifest.json records seeds, configurations, input and source hashes, model hashes, software versions and hardware. Two independent OpenStack runs of the same seed produced byte-identical checkpoints for all 81 learners on the documented workstation; identical weights across different hardware or library versions are not guaranteed. Training refuses to overwrite an existing checkpoint directory.

New seeded baseline: python run.py baseline os --edge-python <edge Python path> trains 81 BAT learners with master seed 62 by default, the seed the published OpenStack checkpoints were trained with, measures the BAT ensemble, exports Q-BAT, calibrates shared thresholds and runs detection with checkpoints under checkpoints/baselines/ and results under outputs/baselines/. The three edge architectures are kept from the released inference configuration; no seed or model search is performed, and no stage is gated on matching a published score. Q-BAT reuses each corresponding BAT .pth threshold unchanged. It records per-learner seeds, deterministic settings, inputs, software/hardware and artifact hashes. EM-GMM thresholds depend on the installed scikit-learn version, so calibration must run with the pinned cloud requirements. It preserves the released model set and does not claim to recover the original unseeded training or its exact scores. The full training workflow is separate from the short evaluation path. Repeatability is scoped to the same software and hardware; newly measured scores must be reported for new models.

Full HDFS detection is supported but its estimated 15-day CPU edge scan is outside the proposed one-day evaluation path. OpenStack is also evaluated in the paper and exercises the same detection implementation. HDFS classification uses the bundled labelled test set independently of detection. The full detection-to-response queue path requires HDFS detection outputs and is not part of the short path. Workflows are selected and printed; no mitigation is executed against a cluster. This is a research artifact, not a production response service.

Public release: CESAL source, parsed data, configurations, thresholds and checks are public; model/runtime downloads are linked by the supplied tools. Third-party datasets and models retain their licenses and access conditions. The README commits to depositing the evaluated revision in a permanent public archive; that deposit and its DOI are pending. GitHub is the current evaluation location, not a permanent-archive identifier.
"""

destructive = """
No workflow executes actions against an external cluster. Local files can be overwritten: infer replaces results in its configured output directory; eval recalibrates every learner's threshold and replaces the bundled threshold files under outputs/<dataset>/ unless a separate threshold_output is configured; classify can replace its results and summary files. Training rejects checkpoint directories already containing .pth files; conversion refuses to replace an existing .pte. The baseline workflow creates fresh checkpoint and output directories for all stages.
Run inference before evaluation as documented, and back up the threshold files before eval if later inference must reuse the shipped calibration. These are existing pipeline behaviors, unchanged by readiness checks.
The check and smoke commands use separate run directories; smoke copies its inputs and thresholds without changing the full evaluation configuration.
Installation creates or updates Conda environments and dependencies. Downloads write checkpoints/runtime files locally; LLM weights use the Hugging Face cache. Logs and repeated experiment outputs consume additional disk space.
"""

