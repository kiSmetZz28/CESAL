# CESAL — ACSAC 2026 artifact metadata (Available, Functional, Reproduced)
#
# ACSAC requires the metadata.toml produced by the official packaging tool
# (https://github.com/jelenamirkovic/artmeta). This file pre-answers every question that tool
# asks, so the tool loads it and each answer is kept by pressing Enter. The tool needs
# Python >= 3.11 (it imports tomllib) and `pip install termcolor tomli_w`. Three questions are
# not stored in the file and must be typed each run: public infrastructure -> n, "more claims?"
# -> y after claims 1-4 and n after claim 5, survey instruments only -> n.
#
# artmeta accepts a single badge; "r" is the highest level and is the one that asks for the
# Functional/Reproduced fields (infrastructure, install script, claims, hw/sw/api/gui).

