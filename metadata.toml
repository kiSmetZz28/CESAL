# CESAL — ACSAC 2026 artifact metadata (Artifacts Available)
#
# ACSAC requires the metadata.toml produced by the official packaging tool
# (https://github.com/jelenamirkovic/artmeta). This file pre-answers the questions that tool
# asks for an "Artifacts Available" submission, so running `python artmeta.py` and entering
# these values takes a few minutes. Regenerate with the tool before submitting rather than
# shipping this file verbatim.
#
# Fields required only for the Functional / Reproduced badges (install_script, the
# claim/script/expected triples, infrastructure_*, hw, sw, gui) are intentionally omitted:
# they apply when badge is "f" or "r".

badge = "a"

artifact_url = "https://github.com/kiSmetZz28/CESAL"
readme = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md"
license_url = "https://github.com/kiSmetZz28/CESAL/blob/main/LICENSE"

cd = "b"   # both code and data: the full CESAL source, plus the HDFS/OpenStack log splits
           # and the open-set knowledge base bundled under data/

citation = """
@inproceedings{shi2026cesal,
  author    = {Shi, Qinxuan and Shao, Sicong},
  title     = {Cloud--Edge Security Analytics for Log-Based Incident Detection,
               Classification, and Controlled Response},
  booktitle = {Annual Computer Security Applications Conference (ACSAC)},
  year      = {2026}
}
"""

# ── Data artifact fields (required because cd = "b") ──────────────────────────
provenance = "https://github.com/logpai/loghub"
# HDFS and OpenStack are public log-analysis benchmarks distributed by loghub. HDFS was
# collected from Hadoop jobs on more than 200 Amazon EC2 nodes; OpenStack was collected from
# a CloudLab deployment with one control node, one network node and eight compute nodes.
# The repository ships the parsed event-sequence splits under data/, and the HDFS open-set
# knowledge base can be rebuilt from loghub's HDFS_v1/preprocessed/Event_traces.csv with
# `python -m incident_response.data_prep`.

ethics = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#datasets-and-provenance"
# Both datasets are public system-log benchmarks containing machine-generated operational
# logs (block identifiers, execution states, error traces). They contain no personal data
# and no human-subject data, and no user study was conducted. CESAL is released under the
# MIT license.

use = "https://github.com/kiSmetZz28/CESAL/blob/main/README.md#full-setup"
