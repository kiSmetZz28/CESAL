# ── Infrastructure ────────────────────────────────────────────────────────────
# CESAL is not deployed on public research infrastructure. Justification below.
infrastructure_constraints = """
The cloud-side BAT ensemble (81 EM-AT models) and the LLM incident-classification stage
require a local CUDA GPU; development and all reported numbers used an NVIDIA RTX 2000 Ada
(16 GB). The edge resource measurements in Table 6 require physical Raspberry Pi 3B+/4B/5
hardware and cannot be reproduced on shared infrastructure. Everything except Table 6 runs
on any single CUDA GPU machine with >= 16 GB VRAM; the edge stage alone runs CPU-only.
"""
infrastructure_access = """
No special access is needed: clone the public repository and run install.sh. Pre-trained
checkpoints are fetched from Google Drive by `python run.py download`. The four LLM
backbones are pulled from Hugging Face; Meta-Llama-3.1-8B-Instruct and gemma-2-9b-it are
gated and require accepting their licenses plus `hf auth login`.
"""

