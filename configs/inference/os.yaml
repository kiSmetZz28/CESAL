dataset: "Openstack"
win_size: 100
data_seq_len: 10
input_c: 10
batch_size: 64
data_path: "data/OpenStack"
output_dir: "outputs/os"
threshold_output: "outputs/os/thresholds_edge.yaml"

routing_tolerance: 0.1
routing_distance: "ma"

edge_models:
  # Selected over all 85,320 three-model combinations by majority-vote F1,
  # subject to an edge-latency budget (no l8: the three models run in
  # parallel, so the deepest sets the wall-clock cost of the edge scan).
  - name: "qbat_e10_k3_l6_b96"
    checkpoint: "checkpoints/qbat/os/Openstack_e10_k3_l6_b96.pte"
  - name: "qbat_e3_k1_l3_b64"
    checkpoint: "checkpoints/qbat/os/Openstack_e3_k1_l3_b64.pte"
  - name: "qbat_e6_k5_l6_b32"
    checkpoint: "checkpoints/qbat/os/Openstack_e6_k5_l6_b32.pte"

cloud:
  model_save_path: "checkpoints/bat/os"
  thresholds_yaml: "outputs/os/thresholds_cloud.yaml"
  voting: "majority"
  num_epochs: [3, 6, 10]
  k: [1, 3, 5]
  e_layer_num: [3, 6, 8]
  batch_size: [32, 64, 96]
