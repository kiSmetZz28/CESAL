lr: 0.0001
win_size: 100
data_seq_len: 10
input_c: 10
output_c: 10
dataset: "Openstack"
mode: "train"
data_path: "data/OpenStack"
model_save_path: "checkpoints/bat/os"

num_epochs: [3, 6, 10]
k: [1, 3, 5]
e_layer_num: [3, 6, 8]
batch_size: [32, 64, 96]

# ── EM-GMM automated thresholding (Sec. 3.5.1) ───────────────────────────────
gmm_n_components: 4
gmm_covariance_type: "tied"
gmm_max_iter: 100
gmm_init_params: "k-means++"
gmm_n_init: 10
