[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cesal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "gdown>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cesal-download = "tools.download_checkpoints:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cesal_core*", "training_pipeline*", "cesal_inference_pipeline*", "incident_response*", "quantization*", "tools*", "dashboard*"]
